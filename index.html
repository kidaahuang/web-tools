<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Share One Landing</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
        background: #f5f6fb;
        color: #1e1e26;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at top, #fefefe, #eef0f8 55%, #e7e9f2);
      }
      header {
        padding: 48px 20px 32px;
        text-align: center;
      }
      header h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3.2rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      header p {
        margin: 0 auto 24px;
        max-width: 560px;
        font-size: 1.05rem;
        color: #555d75;
      }
      .search-bar {
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        gap: 12px;
        background: #fff;
        border-radius: 999px;
        padding: 12px 18px;
        box-shadow: 0 12px 30px rgba(33, 37, 54, 0.12);
        border: 1px solid rgba(70, 78, 105, 0.08);
      }
      .search-bar input {
        border: none;
        outline: none;
        flex: 1;
        font-size: 1rem;
        padding: 4px 8px;
        background: transparent;
      }
      .search-bar span {
        color: #8b8fa6;
        font-size: 1.1rem;
      }
      main {
        padding: 0 20px 60px;
        max-width: 1100px;
        margin: 0 auto;
      }
      .category {
        margin-top: 32px;
      }
      .category h2 {
        font-size: 1.3rem;
        margin-bottom: 16px;
        color: #2f3550;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 16px;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 16px;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 120px;
        box-shadow: 0 8px 18px rgba(27, 32, 51, 0.08);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 30px rgba(27, 32, 51, 0.16);
      }
      .card .title {
        font-weight: 600;
        font-size: 1.05rem;
      }
      .card .link {
        font-size: 0.85rem;
        color: #7280a7;
        word-break: break-all;
      }
      .empty-state {
        margin-top: 40px;
        text-align: center;
        color: #7a8097;
        display: none;
      }
      .footer {
        text-align: center;
        padding: 24px 20px 40px;
        color: #98a0ba;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Web Tools</h1>
      <p>依照分類彙整常用網站資源，一站搜尋找到需要的工具與靈感。</p>
      <div class="search-bar">
        <span>🔍</span>
        <input id="searchInput" type="search" placeholder="搜尋網站名稱或網址" />
      </div>
    </header>
    <main id="content"></main>
    <div class="empty-state" id="emptyState">沒有符合的結果，請試試其他關鍵字。</div>

    <script>
      const content = document.getElementById("content");
      const emptyState = document.getElementById("emptyState");
      const searchInput = document.getElementById("searchInput");
      let menuData = [];

      const render = (query = "") => {
        content.innerHTML = "";
        const keyword = query.trim().toLowerCase();
        let hasResults = false;

        menuData.forEach((group) => {
          const filteredItems = group.items.filter((item) => {
            const text = `${item.title} ${item.url}`.toLowerCase();
            return text.includes(keyword);
          });

          if (!filteredItems.length) {
            return;
          }

          hasResults = true;
          const section = document.createElement("section");
          section.className = "category";

          const heading = document.createElement("h2");
          heading.textContent = group.category;

          const grid = document.createElement("div");
          grid.className = "cards";

          filteredItems.forEach((item) => {
            const card = document.createElement("a");
            card.className = "card";
            card.href = item.url;
            card.target = "_blank";
            card.rel = "noopener noreferrer";

            const title = document.createElement("div");
            title.className = "title";
            title.textContent = item.title;

            const link = document.createElement("div");
            link.className = "link";
            link.textContent = item.url;

            card.append(title, link);
            grid.appendChild(card);
          });

          section.append(heading, grid);
          content.appendChild(section);
        });

        emptyState.style.display = hasResults ? "none" : "block";
      };

      fetch("menu.json")
        .then((response) => response.json())
        .then((data) => {
          menuData = data;
          render();
        })
        .catch(() => {
          content.innerHTML = "<p>無法載入 menu.json，請確認檔案是否存在。</p>";
        });

      searchInput.addEventListener("input", (event) => {
        render(event.target.value);
      });
    </script>
  </body>
</html>
